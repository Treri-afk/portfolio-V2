# Portfolio V2 — paulabraham.fr. Pre-rendered site in /var/www/portfolio-v2, contact API on 127.0.0.1:3050
# (Docker container portfolio-api). Installed by deploy/deploy.sh --nginx. See docs/adr/0007 and 0008.
server {
    server_name paulabraham.fr www.paulabraham.fr;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/paulabraham.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/paulabraham.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    include /etc/nginx/snippets/cloudflare-realip.conf;

    access_log /var/log/nginx/portfolio.access.log;
    error_log  /var/log/nginx/portfolio.error.log;

    server_tokens off;
    client_header_timeout 10s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    root /var/www/portfolio-v2;
    index index.html;

    location / {
        try_files $uri $uri/index.html =404;
    }
    error_page 404 /__spa-fallback.html;

    location /assets/ {
        expires 1y;
    }
    location /media/ {
        expires 30d;
    }

    location = /v1/contact {
        limit_except POST OPTIONS { deny all; }
        limit_req zone=portfolio_contact burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        client_body_timeout 10s;
        proxy_pass http://127.0.0.1:3050;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_hide_header X-Powered-By;
    }
    location /v1/ {
        return 404;
    }
}

server {
    listen 80;
    server_name paulabraham.fr www.paulabraham.fr;
    server_tokens off;
    return 301 https://$host$request_uri;
}
